<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page non trouvée (404) — LifeSave Bénin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      body {
        background-color: #0B1528;
        color: #FFFFFF;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 40px 24px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .badge {
        display: inline-block;
        background: rgba(224, 82, 83, 0.15);
        color: #FF7C8E;
        border: 1px solid rgba(224, 82, 83, 0.3);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        padding: 6px 16px;
        border-radius: 9999px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 32px;
        font-weight: 900;
        margin-bottom: 12px;
        color: #FFFFFF;
      }
      h1 span {
        color: #E05253;
      }
      p {
        color: #94A3B8;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #E05253;
        color: #FFFFFF;
        font-weight: 700;
        font-size: 15px;
        padding: 14px 28px;
        border-radius: 9999px;
        text-decoration: none;
        box-shadow: 0 10px 20px rgba(224, 82, 83, 0.3);
        transition: all 0.2s ease;
      }
      .btn:hover {
        background: #C62828;
        transform: translateY(-2px);
      }
      .brand {
        margin-top: 24px;
        font-size: 14px;
        font-weight: 800;
        color: #64748B;
      }
      .brand span {
        color: #2563EB;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Erreur 404 — Oups !</div>
      <h1>Page introuvable sur <span>LifeSave</span></h1>
      <p>La page que vous recherchez n'existe pas ou a été déplacée. Pas de panique, vous pouvez revenir directement sur la plateforme principale.</p>
      <a href="/" class="btn">
        <span>← Retour à l'accueil</span>
      </a>
      <div class="brand">Life<span>Save</span> Bénin</div>
    </div>
  </body>
</html>
